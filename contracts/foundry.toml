[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "shanghai"
# read-write within the repo: DeployE2E writes ./addresses.json (deploy job copies it out)
fs_permissions = [{ access = "read-write", path = "." }]

[fuzz]
runs = 256

[invariant]
runs = 32
depth = 20
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4
